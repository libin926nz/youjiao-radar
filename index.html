.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:6px}
.card.lead{border-color:#f2b36b;background:linear-gradient(180deg,#fffaf0,#fff 60%)}.card .nm{font-weight:700;line-height:1.3}.card .meta{color:var(--mut);font-size:12.5px}
.badges{display:flex;flex-wrap:wrap;gap:4px}.b{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.b.stage{color:#fff}.b.w-open{background:#e3f5ec;color:#1b7a4f;border-color:#bfe6d2}.b.w-soon{background:#fff3d6;color:#8a5a00;border-color:#f1d78d}.b.w-closed{background:#f6e1de;color:#9b2f25;border-color:#e7b9b3}.b.w-unk{background:#eceef1;color:#59616d;border-color:#d9dde3}
.b.g-A{background:#e3f5ec;color:#1b7a4f}.b.g-B{background:#e8eefc;color:#2d4ba0}.b.g-C{background:#eceef1;color:#59616d}
.b.flag-CRITICAL{background:#c4473a;color:#fff}.b.flag-NEW{background:#2e9e6b;color:#fff}.b.flag-UPDATE{background:#4a6fd0;color:#fff}.b.flag-WATCH{background:#eceef1;color:#59616d}.b.flag-CLOSED{background:#d9dde3;color:#59616d}
.b.crm{background:#fff;border-color:var(--line);color:var(--ink)}.b.c-first{background:#e8eefc;color:#2d4ba0}.b.c-reply{background:#e3f5ec;color:#1b7a4f}.b.c-none{background:#f4f1e8;color:#6b7482}.b.c-hold{background:#eceef1;color:#59616d}.b.c-quote{background:#efe4fb;color:#5b2d9e}
.b.lead{background:#ff8a2a;color:#fff}.b.draft{background:#fff3d6;color:#8a5a00}
.more{font-size:12.5px;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;color:#333;display:none}.card.open .more{display:block}.more p{margin:3px 0}.tgl{margin-left:auto;border:0;background:none;color:var(--brand);font-size:12px;padding:0}
.row{display:flex;gap:8px;align-items:center}
table.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{text-align:left;color:var(--mut);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tb td{padding:8px;border-bottom:1px solid #f0ede5;vertical-align:top}.tb tr:hover td{background:#faf8f2}
.scroll{overflow-x:auto}.mut{color:var(--mut)}.muted{color:var(--mut)}.sm{font-size:12px}
.pill{white-space:nowrap;display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px}.p-sent{background:#e8eefc;color:#2d4ba0}.p-replied{background:#e3f5ec;color:#1b7a4f}.p-draft{background:#fff3d6;color:#8a5a00}.p-hold{background:#eceef1;color:#59616d}.p-bad{background:#f6e1de;color:#9b2f25}
.empty{padding:28px;text-align:center;color:var(--mut);background:#faf8f2;border:1px dashed var(--line);border-radius:12px}
.wa{display:flex;gap:10px;align-items:flex-start}.wa .info{flex:1;min-width:0}.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:7px 12px;font-weight:600;text-decoration:none}.btn.wa-g{background:#25d366;color:#073b1d}.btn.ghost{background:#f0ede5;color:var(--ink)}.btn.dis{background:#eceef1;color:#9aa3ad;cursor:not-allowed}
.note{background:#fff8e6;border:1px solid #f1d78d;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:12px}
#map{height:68vh;min-height:420px;border-radius:var(--r);border:1px solid var(--line);z-index:1}
.mapwrap{display:grid;grid-template-columns:260px 1fr;gap:12px}@media(max-width:860px){.mapwrap{grid-template-columns:1fr}#map{height:56vh}}
.leg{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}.leg i{width:12px;height:12px;border-radius:50%;display:inline-block}
.popup{font-size:12.5px;max-width:260px}.popup b{font-size:13.5px}
.digest{max-width:900px}.digest h1{font-size:20px}.digest h2{font-size:17px;margin-top:20px}.digest h3{font-size:15px}.digest table{border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}.digest th,.digest td{border:1px solid var(--line);padding:4px 7px;vertical-align:top}.digest th{background:#f4f1e8}.digest code{background:#f0ede5;padding:0 4px;border-radius:4px}
.lk{position:fixed;inset:0;z-index:999;background:radial-gradient(1200px 600px at 20% -10%,#cfe6e1,transparent),radial-gradient(900px 500px at 100% 110%,#f7d9cc,transparent),#f6f4ef;display:flex;align-items:center;justify-content:center;padding:20px}
.lkbox{width:min(400px,100%);background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(20,30,40,.18);padding:30px 26px;text-align:center}.lkbox h1{margin:10px 0 4px;font-size:22px}.lkbox p{color:var(--mut);margin:0 0 16px}.lkbox input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:10px}.lkbox button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px}.lkbox .err{color:var(--bad);min-height:20px;font-size:13px;margin-top:8px}
footer{max-width:1280px;margin:0 auto;padding:10px 16px 40px;color:var(--mut);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}.tile{background:#f4f1e8;border-radius:12px;padding:10px 12px}.tile b{font-size:22px;display:block}.tile span{font-size:12px;color:var(--mut)}
.wk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.wk button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}.wk button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
ul.l{margin:6px 0;padding-left:18px}ul.l li{margin:3px 0}
[hidden]{display:none!important}
.kpi b{white-space:nowrap}.kpi b.s{font-size:19px;padding-top:5px}
</style></head>
<body>
<div class="lk" id="lock" ><form class="lkbox" id="lockform" autocomplete="off"><div class="logo" style="justify-content:center"><i></i>幼教雷达</div><h1>澳洲 + 加拿大</h1><p>请输入访问密码</p>
<input type="password" id="pw" placeholder="访问密码" autofocus autocomplete="current-password"><button type="submit" id="unlock">解锁</button><div class="err" id="lockerr"></div></form></div>
<div id="app" hidden>
<div class="top"><div class="top-in"><div class="logo"><i></i>幼教雷达 · 澳洲 + 加拿大</div>
<div class="sw"><button data-m="AU" class="on">🇦🇺 澳洲</button><button data-m="CA">🇨🇦 加拿大</button></div>
</div>
<div class="tabs"><button data-t="overview" class="on">总览</button><button data-t="dev">客户开发</button><button data-t="email">邮件</button><button data-t="map">地图</button><button data-t="week">本周更新</button></div></div>
<main><div class="kpis" id="kpis"></div>
<section class="pane" id="p-overview"></section>
<section class="pane" id="p-dev" hidden>
<div class="panel"><h3>开发漏斗<small>点击筛选 · 未联系 → 已首触 → 已回复 → 报价中 → 暂缓/关闭</small></h3><div class="funnel" id="funnel"></div>
<div class="filters"><input type="search" id="f-q" placeholder="搜索项目 / 运营商 / 城市 / ID"><select id="f-region"></select><select id="f-stage"></select><select id="f-win"></select><select id="f-grade"></select><select id="f-sort"></select>
<label class="chk"><input type="checkbox" id="f-lead">只看优先线索</label><label class="chk"><input type="checkbox" id="f-closed">含已关闭</label><button class="btn ghost" id="f-reset">重置</button></div><div class="mut sm" id="dev-count"></div></div>
<div class="cards" id="cards"></div></section>
<section class="pane" id="p-email" hidden><div class="kpis" id="e-kpi"></div>
<div class="panel"><div class="filters"><input type="search" id="e-q" placeholder="搜索项目 / 收件人 / 主题"><select id="e-cat"></select><span class="mut sm" id="e-count"></span></div>
<div class="scroll"><table class="tb"><thead id="e-head"></thead><tbody id="e-body"></tbody></table></div></div></section>

<section class="pane" id="p-map" hidden><div class="mapwrap"><div><div class="panel"><h3>图层</h3><div id="m-leg"></div><div id="m-stat" class="sm"></div><p class="sm mut">圆点颜色=阶段，大小=学位数，黑色描边=优先线索，空心虚线圈=城市级近似位置。</p></div><div class="panel" id="m-none"></div></div><div id="map"></div></div></section>

<section class="pane" id="p-week" hidden><div class="wk" id="wk-sel"></div><div id="wk-body"></div></section>
</main><footer>数据来自公开信息与团队调研，暂未验证的字段标「未找到」。联系方式等详细资料仅内部版提供。<br><span id="meta"></span></footer></div>

(function(){
var E=JSON.parse(document.getElementById('enc').textContent);
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function dec(pw){
 if(!window.crypto||!crypto.subtle)throw new Error('nosubtle');
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
 var ds=new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')));
 return JSON.parse(await ds.text());
}
async function open(pw,remember){
 var err=document.getElementById('lockerr'),btn=document.getElementById('unlock');err.textContent='';btn.disabled=true;btn.textContent='解锁中…';
 try{window.RADAR=await dec(pw);try{if(remember)sessionStorage.setItem('radar_pw',pw)}catch(e){}
  document.getElementById('lock').hidden=true;document.getElementById('app').hidden=false;window.__radarInit();}
 catch(e){try{sessionStorage.removeItem('radar_pw')}catch(_){}
  err.textContent=(e&&e.message==='nosubtle')?'此浏览器环境不支持加密解锁，请使用 HTTPS 地址或直接用本地文件打开。':(e&&e.name==='OperationError'?'密码不正确':'解锁失败：'+(e&&e.message||e));
  btn.disabled=false;btn.textContent='解锁';}
}
document.getElementById('lockform').addEventListener('submit',function(ev){ev.preventDefault();var v=document.getElementById('pw').value;if(v)open(v,true)});
try{var s=sessionStorage.getItem('radar_pw');if(s)open(s,false)}catch(e){}
})();
